name: CI

on:
  push:   # qualquer branch
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:   # banco real pros testes de integração - o sqlite não valida String(n)
        image: postgres:16-alpine   # mesma imagem do docker-compose
        env:
          POSTGRES_USER: cerradinho
          POSTGRES_PASSWORD: cerradinho
          POSTGRES_DB: cerradinho
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend   # onde ficam requirements, pytest.ini e o pacote app/

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # já inclui requirements.txt

      - name: Rodar SAST (bandit)
        run: bandit -r app -lll   # falha em achado de severidade alta (RNF08)

      - name: Rodar lint (ruff)
        run: ruff check .

      - name: Rodar testes (pytest)
        run: pytest --ignore=tests/contract --ignore=tests/integration --cov=app --cov-report=term-missing   # contrato e integração rodam nos passos abaixo

      - name: Rodar testes de contrato (schemathesis)
        run: pytest tests/contract -v   # falha se alguma rota fugir do /openapi.json (RNF04)

      - name: Rodar testes de integração (Postgres)
        run: pytest tests/integration -v   # scraper -> domínio -> postgres real, com o schema das migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
