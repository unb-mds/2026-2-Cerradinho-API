site_name: Cerradinho
site_description: API aberta com os dados públicos da UnB
site_url: https://unb-mds.github.io/2026-2-Cerradinho-API/
repo_name: unb-mds/2026-2-Cerradinho-API
repo_url: https://github.com/unb-mds/2026-2-Cerradinho-API
edit_uri: edit/dev/docs/

docs_dir: docs

theme:
  name: material
  language: pt-BR
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - Início:
      - index.md
      - Telas do site: produto/telas.md
      - Documentação da API: https://api.3-147-228-104.sslip.io/docs
      - SDK e CLI: https://github.com/unb-mds/2026-2-Cerradinho-API/blob/dev/sdk/README.md
  - Arquitetura:
      - Arquitetura: ARQUITETURA.md
      - Deploy na AWS Lightsail: DEPLOY.md
      - Decisões de arquitetura (ADR):
          - 0001 — Base técnica do backend: adr/0001-base-tecnica-backend.md
          - 0002 — Ferramentas de scraping por fonte: adr/0002-ferramentas-de-scraping.md
          - 0003 — Celery e Redis para o agendamento: adr/0003-celery-e-redis-para-agendamento.md
          - 0004 — Coleta desacoplada da API: adr/0004-coleta-desacoplada-da-api.md
          - 0005 — API versionada desde o início: adr/0005-api-versionada-desde-o-inicio.md
          - 0006 — Salas derivadas das turmas: adr/0006-salas-derivadas-das-turmas.md
          - 0007 — Cache e rate limit na API: adr/0007-cache-e-rate-limit-na-api.md
          - 0008 — Bandit como SAST: adr/0008-bandit-como-sast.md
          - 0009 — Railway para hospedagem: adr/0009-railway-para-deploy.md
          - 0010 — Sala por horário, não por turma: adr/0010-sala-por-horario-nao-por-turma.md
          - 0011 — AWS Lightsail para hospedagem: adr/0011-aws-lightsail-para-deploy.md
          - Template de ADR: adr/template.md
      - Fontes de dado:
          - SIGAA — Disciplinas: fontes/sigaa-disciplinas.md
          - RU — Cardápio: fontes/ru-cardapio.md
          - Relatório de risco: fontes/relatorio-de-risco.md
          - Plano de monitoramento: fontes/plano-de-monitoramento.md
  - Contribuir:
      - Como contribuir: CONTRIBUIR.md
      - Código de Conduta: https://github.com/unb-mds/2026-2-Cerradinho-API/blob/dev/CODE_OF_CONDUCT.md
      - Política de segurança: https://github.com/unb-mds/2026-2-Cerradinho-API/blob/dev/SECURITY.md
      - Changelog: https://github.com/unb-mds/2026-2-Cerradinho-API/blob/dev/CHANGELOG.md
  - Histórico:
      - Produto:
          - Documento de Visão: DOCUMENTO-VISAO.md
          - Requisitos: REQUISITOS.md
          - Especificação (/specs): specs/README.md
      - Processo e gestão:
          - Processo: PROCESSO.md
          - Planejamento e acompanhamento:
              - Planejamento de sprints: scrum/sprint-planning.md
              - Retrospectivas de sprint: scrum/retrospectivas.md
              - Atas de reunião: scrum/atas.md
          - Checklists:
              - Checklist Release 1: scrum/checklist-release-1.md
              - Checklist Release 2: scrum/checklist-release-2.md
      - Release notes:
          - v2.0 (Release 2): releases/v2.0.md
          - v1.4: releases/v1.4.md
          - v1.3: releases/v1.3.md
          - v1.2: releases/v1.2.md
      - Estudos:
          - Fundamentos:
              - Git e GitHub: estudos/estudo-git-github.md
              - HTML: estudos/estudo-html.md
              - JavaScript: estudos/estudo-javascript.md
          - Coleta de dados:
              - Web scraping: estudos/estudo-web-scraping.md
              - Playwright: estudos/estudo-playwright.md
              - BeautifulSoup: estudos/estudo-beautifulsoup.md
          - Backend:
              - FastAPI: estudos/estudo-fastapi.md
              - SQLAlchemy: estudos/estudo-sqlalchemy.md
              - Celery e Redis: estudos/estudo-celery-e-redis.md
          - Qualidade e testes:
              - Pytest e mocking: estudos/estudo-pytest-mocking.md
              - Schemathesis: estudos/estudo-schemathesis.md
              - Postman e testes de API: estudos/estudo-postman-api.md
              - Teste de mutação: estudos/estudo-teste-de-mutacao.md
              - UptimeRobot: estudos/estudo-uptimerobot.md
      - Índice completo: indice-completo.md

extra_css:
  - stylesheets/cerradinho.css
