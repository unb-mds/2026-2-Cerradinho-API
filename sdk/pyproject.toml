[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerradinho-sdk"
version = "1.0.0"
description = "Cliente Python pra API pública da Cerradinho (RF13)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.23.0,<1.0",
    "attrs>=22.2.0",
]

[project.urls]
Repositorio = "https://github.com/unb-mds/2026-2-Cerradinho-API"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "openapi-python-client>=0.29",
]

[tool.setuptools.packages.find]
include = ["cerradinho_sdk*"]
